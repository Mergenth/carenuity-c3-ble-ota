name: Firmware

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.3
          target: esp32c3
          path: firmware
          command: >
            idf.py build &&
            cd build &&
            python -m esptool --chip esp32c3 merge-bin
            -o Carenuity-BLE-OTA-Loader-C3-Mini.ino.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: carenuity-ble-ota-loader
          path: firmware/build/Carenuity-BLE-OTA-Loader-C3-Mini.ino.bin
